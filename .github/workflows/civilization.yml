name: Civilization

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим работы"
        type: choice
        default: test
        options:
          - test

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Проверить среду
        run: |
          echo "Режим: ${{ inputs.mode }}"
          echo "Время UTC: $(date -u)"
          python3 --version
          (ffmpeg -version | head -n 1) || echo "FFmpeg не найден"
          ls -la
