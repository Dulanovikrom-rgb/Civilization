name: Civilization

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/civilization.yml"
      - "scripts/**"
      - "source/**"
      - "images/**"
      - "*.docx"

permissions:
  contents: write

concurrency:
  group: civilization
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить библиотеки и шрифты
        run: |
          pip install python-docx pillow
          sudo apt-get install -y fonts-dejavu-core

      - name: Разобрать выпуски и проверить
        run: python scripts/build.py

      - name: Нарисовать обложки
        run: python scripts/covers.py

      - name: Сохранить результат в репозитории
        if: always()
        run: |
          git config user.name "civilization-bot"
          git config user.email "civilization-bot@users.noreply.github.com"
          git add articles prompts data covers images/.gitkeep
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Обновлены выпуски, реестр и обложки"
            git push
          fi
